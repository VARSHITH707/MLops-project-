name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MLFLOW_DISABLE_AGENT_HINT: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Unit and API tests
        run: pytest -q

      - name: Small end-to-end pipeline (generate -> validate -> split -> train)
        run: |
          export PM_HOME="$RUNNER_TEMP/pm" PM_PARAMS_FILE="$PWD/params.yaml"
          mkdir -p "$PM_HOME"
          python -m src.data.generate_data --n-samples 2000
          python -m src.data.validate_data
          python -m src.features.build_features
          python scripts/train_model.py
          for f in data/raw/sensors.csv data/processed/train.csv data/processed/test.csv \
                   artifacts/current.json reports/metrics.json reports/training_report.json; do
            test -s "$PM_HOME/$f" || { echo "missing $f"; exit 1; }
          done
          cat "$PM_HOME/reports/metrics.json"

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t predictive-maintenance-mlops:ci .
      - name: Train inside the container and check the API health endpoint
        run: |
          docker run --rm -d --name pm -p 8000:8000 predictive-maintenance-mlops:ci \
            sh -c "python scripts/setup.py && python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"
          for i in $(seq 1 60); do
            curl -fs http://localhost:8000/health && break
            sleep 5
          done
          curl -fs http://localhost:8000/health | grep '"model_loaded":true'
          docker logs pm | tail -20
          docker stop pm
